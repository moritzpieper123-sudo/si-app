<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="85%">
      <stop offset="0" stop-color="#2b2716"/>
      <stop offset=".55" stop-color="#121114"/>
      <stop offset="1" stop-color="#050506"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f5d76e" stop-opacity=".45"/>
      <stop offset="1" stop-color="#f5d76e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".30"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset=".5" stop-color="#f5d76e"/>
      <stop offset="1" stop-color="#d9a93a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="262" r="230" fill="url(#glow)"/>
  <!-- glass tile -->
  <rect x="112" y="112" width="288" height="288" rx="84" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".28" stroke-width="3"/>
  <!-- top specular highlight -->
  <path d="M140 150 Q256 96 372 150 Q256 136 140 150 Z" fill="url(#sheen)" opacity=".55"/>
  <path d="M150 172 Q256 118 362 172" fill="none" stroke="url(#sheen)" stroke-width="6" stroke-linecap="round" opacity=".5"/>
  <!-- progress ring -->
  <circle cx="256" cy="256" r="104" fill="none" stroke="#f5d76e" stroke-opacity=".22" stroke-width="18"/>
  <circle cx="256" cy="256" r="104" fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="round" stroke-dasharray="520 140" transform="rotate(-90 256 256)"/>
  <!-- check -->
  <path d="M206 262 L240 296 L306 224" fill="none" stroke="url(#gold)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
